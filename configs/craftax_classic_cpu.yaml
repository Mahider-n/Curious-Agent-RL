# Pilot configuration shared by vanilla DQN and curious DQN.

environment:
  name: "Craftax-Classic-Symbolic-v1"
  max_episode_steps: 10000

networks:
  q_network:
    hidden_dims: [128, 128]
    learning_rate: 0.0001
    use_dueling: true
    value_hidden_dim: 64
    advantage_hidden_dim: 64
  world_model:
    hidden_dims: [64, 64]
    learning_rate: 0.001
  confidence_net:
    hidden_dims: [32, 32]
    learning_rate: 0.0005

agent:
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 80000
  beta: 1.0

training:
  total_steps: 100000
  replay_capacity: 20000
  learning_starts: 2000
  batch_size: 32
  train_frequency: 4
  log_every_steps: 1000
  checkpoint_every_steps: 25000
  seed: 0
  device: "cpu"
  torch_num_threads: 8

target_network:
  update_frequency: 100
  tau: 0.005

evaluation:
  episodes: 10
  max_episode_steps: 10000
  epsilon: 0.0
  seed_offset: 10000

paths:
  output_root: "runs/craftax_classic"
